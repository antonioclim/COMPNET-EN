services:
  mail:
    image: mailserver/docker-mailserver:latest
    container_name: dms
    hostname: mail.example.test
    env_file:
      - mailserver.env
    ports:
      - "127.0.0.1:25:25"     # SMTP (server-to-server)
      - "127.0.0.1:587:587"   # SMTP submission (client)
      - "127.0.0.1:143:143"   # IMAP
      - "127.0.0.1:993:993"   # IMAPS
      - "127.0.0.1:110:110"   # POP3
      - "127.0.0.1:995:995"   # POP3S
    volumes:
      - ./docker-mailserver:/tmp/docker-mailserver
      - ./tls:/tmp/dms/custom-certs:ro
      - dms-maildata:/var/mail
      - dms-state:/var/mail-state
      - dms-logs:/var/log/mail
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    depends_on:
      - mail
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mail
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail
      - ROUNDCUBEMAIL_SMTP_PORT=587
    volumes:
      - ./roundcube/compnet.inc.php:/var/roundcube/config/compnet.inc.php:ro
      - ./tls/ca.crt:/etc/ssl/compnet-ca.crt:ro
    restart: unless-stopped

volumes:
  dms-maildata:
  dms-state:
  dms-logs:

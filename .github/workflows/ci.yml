name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            00_TOOLS/qa/requirements.txt
            03_LECTURES/tests/requirements.txt
      - name: Set up Node for HTML control-logic tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install QA dependencies
        run: python -m pip install -r 00_TOOLS/qa/requirements.txt
      - name: Check source and component regressions
        run: python 00_TOOLS/qa/run_checks.py
